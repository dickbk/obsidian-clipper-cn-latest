# Detect-only: never rebase or release automatically.
# Cron is 06:00 Asia/Shanghai (UTC 22:00).
name: Detect official update

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Compare official baseline
        id: compare
        run: |
          set -euo pipefail
          RESULT=$(node scripts/detect-official-update.js)
          echo "$RESULT"
          echo "result<<EOF" >> "$GITHUB_OUTPUT"
          echo "$RESULT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          NEEDS=$(echo "$RESULT" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const j=JSON.parse(s);console.log(j.needsUpdate?'true':'false')})")
          echo "needs_update=$NEEDS" >> "$GITHUB_OUTPUT"
          BASELINE=$(echo "$RESULT" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>console.log(JSON.parse(s).baseline))")
          LATEST=$(echo "$RESULT" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>console.log(JSON.parse(s).latest))")
          echo "baseline=$BASELINE" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Open or refresh follow Issue
        if: steps.compare.outputs.needs_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASELINE: ${{ steps.compare.outputs.baseline }}
          LATEST: ${{ steps.compare.outputs.latest }}
        run: |
          set -euo pipefail
          TITLE="[official-follow] Upstream ${LATEST} available (baseline ${BASELINE})"
          BODY=$(cat <<EOF
          ## Official update detected

          | | |
          | --- | --- |
          | CN tracked baseline | \`${BASELINE}\` (\`docs/official-baseline\`) |
          | Official latest | \`${LATEST}\` |
          | Official repo | https://github.com/obsidianmd/obsidian-clipper |
          | Official releases | https://github.com/obsidianmd/obsidian-clipper/releases |

          ## Next steps (human / Codex — not automatic)

          1. Codex: produce upgrade strategy (hook impact, CN product version bump, regression list). See \`docs/ops-hermes-codex.md\`.
          2. Approve via Feishu: \`#同意升级 <CN产品版本>\` (dual-channel; Feishu command is authoritative).
          3. Only then: \`npm run overlay:rebase -- ${LATEST}\`, update version table + \`docs/official-baseline\`, Release.

          **Do not** rebase or publish from this workflow.
          EOF
          )
          # Prefer one open issue per label; update body if title already matches latest.
          EXISTING=$(gh issue list --label official-follow --state open --json number,title --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --title "$TITLE" --body "$BODY"
            echo "Updated issue #$EXISTING"
          else
            gh label create official-follow --description "Official Web Clipper version follow" --color 0052CC 2>/dev/null || true
            gh issue create --title "$TITLE" --label official-follow --body "$BODY"
          fi

      - name: No update
        if: steps.compare.outputs.needs_update != 'true'
        run: |
          echo "Baseline ${{ steps.compare.outputs.baseline }} matches official ${{ steps.compare.outputs.latest }}. No issue."
